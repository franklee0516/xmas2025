<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="聖誕快樂 - 給 {{NAME}} 的卡片">
    <meta property="og:description" content="點擊開啟你的專屬祝福 🎁">
    <title>Merry Christmas, {{NAME}}!</title>
    
    <link rel="stylesheet" href="../style.css"> 
    <style>
        /* 簡單的內聯樣式，正式版建議移到 style.css */
        body { margin: 0; background: #0f2027; color: white; font-family: sans-serif; overflow: hidden; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s; }
        .gift-icon { font-size: 80px; cursor: pointer; animation: bounce 2s infinite; }
        .content { padding: 20px; text-align: center; display: none; max-width: 600px; margin: 0 auto; line-height: 1.6; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>

    <div id="opener" class="overlay">
        <div class="gift-icon">🎁</div>
        <p>Tap to Open</p>
    </div>

    <audio id="bgm" loop>
        <source src="../assets/music.mp3" type="audio/mpeg">
    </audio>

    <div id="main-content" class="content">
        <h1>{{TITLE}}</h1>
        <hr style="width: 50%; border-color: #d63333;">
        <div class="message-body">
            {{CONTENT}}
        </div>
        <br><br>
        <small>Made with ❤️ by [你的名字]</small>
    </div>

    <script>
        // 簡單的互動邏輯
        document.getElementById('opener').addEventListener('click', function() {
            const audio = document.getElementById('bgm');
            const overlay = document.getElementById('opener');
            const content = document.getElementById('main-content');

            // 1. 播放音樂
            audio.volume = 0.6;
            audio.play().catch(e => console.log("Audio play failed:", e));

            // 2. 特效：雪花 (這裡可以呼叫外部 function)
            // createSnow(); 

            // 3. 切換畫面
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                content.style.display = 'block';
                // 簡單淡入
                content.style.opacity = '0';
                let op = 0;
                let timer = setInterval(function () {
                    if (op >= 1){ clearInterval(timer); }
                    content.style.opacity = op;
                    content.style.filter = 'alpha(opacity=' + op * 100 + ")";
                    op += 0.1;
                }, 50);
            }, 800);
        });
    </script>
</body>
</html>
